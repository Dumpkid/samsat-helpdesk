<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - Helpdesk Jaringan Samsat</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="/"><i class="bi bi-headset"></i> Helpdesk Jaringan Samsat</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link active" href="/">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="/tickets.html">Tiket Gangguan</a></li>
        </ul>
        <span class="navbar-text me-3"><i class="bi bi-person-circle"></i> <span id="currentUser"></span></span>
        <button class="btn btn-outline-light btn-sm" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Logout</button>
      </div>
    </div>
  </nav>

  <main class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h4 mb-0">Dashboard</h1>
      <a href="/tickets.html?lapor=1" class="btn btn-danger"><i class="bi bi-exclamation-triangle"></i> Lapor Gangguan</a>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-6 col-lg"><div class="card stat-card"><div class="card-body">
        <div class="stat-label">Tiket Baru</div><div class="stat-value text-danger" id="statBaru">-</div></div></div></div>
      <div class="col-6 col-lg"><div class="card stat-card"><div class="card-body">
        <div class="stat-label">Diproses</div><div class="stat-value text-warning" id="statDiproses">-</div></div></div></div>
      <div class="col-6 col-lg"><div class="card stat-card"><div class="card-body">
        <div class="stat-label">Selesai</div><div class="stat-value text-success" id="statSelesai">-</div></div></div></div>
      <div class="col-6 col-lg"><div class="card stat-card"><div class="card-body">
        <div class="stat-label">Laporan Hari Ini</div><div class="stat-value" id="statHariIni">-</div></div></div></div>
      <div class="col-12 col-lg"><div class="card stat-card"><div class="card-body">
        <div class="stat-label">Rata-rata Penanganan</div><div class="stat-value" id="statRata">-</div></div></div></div>
    </div>

    <div class="row g-3">
      <div class="col-lg-6"><div class="card h-100"><div class="card-header">Tiket per Kategori Gangguan</div>
        <div class="card-body"><canvas id="chartKategori"></canvas></div></div></div>
      <div class="col-lg-6"><div class="card h-100"><div class="card-header">5 Lokasi dengan Gangguan Terbanyak</div>
        <div class="card-body"><canvas id="chartLokasi"></canvas></div></div></div>
    </div>
  </main>

  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
